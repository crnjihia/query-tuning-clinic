services:
  db:
    image: postgres:15-alpine
    container_name: qtclinic-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./sql/01_seed_broken_schema.sql:/docker-entrypoint-initdb.d/01_seed_broken_schema.sql:ro
      - ./sql:/sql:ro
      - ./benchmarks:/benchmarks:ro
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "max_connections=200"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shop"]
      interval: 2s
      timeout: 3s
      retries: 30

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: qtclinic-pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: shop
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "20"
      LISTEN_PORT: "6432"
      AUTH_TYPE: plain
    ports:
      - "6432:6432"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
