name: Query Tuning Clinic CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start PostgreSQL and PgBouncer stack
        run: |
          docker compose up -d
          echo "Waiting for PostgreSQL service health..."
          until docker exec qtclinic-db pg_isready -U postgres -d shop; do
            sleep 2
          done

      - name: Wait for 1.2M rows seed completion
        run: |
          echo "Waiting for seed script to finish inserting 1.2M rows..."
          for i in {1..60}; do
            COUNT=$(docker exec qtclinic-db psql -U postgres -d shop -t -A -c "SELECT COUNT(*) FROM orders;" 2>/dev/null || echo 0)
            if [ "$COUNT" -ge 1200000 ]; then
              echo "Database seeded with $COUNT orders."
              break
            fi
            sleep 2
          done

      - name: Run Stage 1 — Diagnosis (02_diagnose.sql)
        run: |
          docker exec -i qtclinic-db psql -U postgres -d shop -f /sql/02_diagnose.sql

      - name: Run Stage 2 — Add Production Indexes (03_add_indexes.sql)
        run: |
          docker exec -i qtclinic-db psql -U postgres -d shop -f /sql/03_add_indexes.sql

      - name: Run Stage 3 & 4 — Query Rewrites & Materialized View (04_rewrite_queries.sql)
        run: |
          docker exec -i qtclinic-db psql -U postgres -d shop -f /sql/04_rewrite_queries.sql

      - name: Run Stage 5 — Declarative Partitioning (05_partition_orders.sql)
        run: |
          docker exec -i qtclinic-db psql -U postgres -d shop -f /sql/05_partition_orders.sql

      - name: Run Stage 6 — PgBouncer Concurrency Benchmark (pgbench_after.sql)
        run: |
          docker exec -e PGPASSWORD=postgres qtclinic-db pgbench -h pgbouncer -p 6432 -U postgres -d shop -t 30 -c 20 -n -M simple -f /benchmarks/pgbench_after.sql

      - name: Teardown
        if: always()
        run: |
          docker compose down -v
