<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="pgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Database Disks -->
  <g transform="translate(14, 11)">
    <!-- Top Disk -->
    <ellipse cx="18" cy="8" rx="16" ry="6" fill="#1e293b" stroke="url(#pgGrad)" stroke-width="2.2" />
    <ellipse cx="18" cy="8" rx="11" ry="3.5" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>

    <!-- Middle Cylinder -->
    <path d="M 2 8 V 18 C 2 22 34 22 34 18 V 8" fill="none" stroke="url(#pgGrad)" stroke-width="2.2" />
    <!-- Bottom Cylinder -->
    <path d="M 2 18 V 28 C 2 32 34 32 34 28 V 18" fill="none" stroke="url(#pgGrad)" stroke-width="2.2" />
  </g>

  <!-- Performance Lightning Bolt -->
  <polygon points="36,18 25,32 32,32 28,48 43,30 35,30" fill="url(#boltGrad)" filter="url(#glow)"/>
</svg>
